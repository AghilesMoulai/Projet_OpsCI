apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinematheque
  namespace: cinematheque
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
