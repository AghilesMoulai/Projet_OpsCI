type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "change-me"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "change-me"
