apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cinematheque
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@host/dbname?sslmode=require"
  SECRET_KEY: "change-me-in-production"
