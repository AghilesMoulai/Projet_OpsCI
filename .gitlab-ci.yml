stages:
 - test
 - build
 - security
 - deploy

backend_tests:
 stage: test
 image: node:20
 cache:
  key: backend-${CI_COMMIT_REF_SLUG}
  paths:
   - backend/.npm/
 before_script:
  - cd backend
  - npm ci --cache .npm --prefer-offline
 script:
  - npm test
  
frontend_tests:
 stage: test
 image: node:20
 cache:
  key: frontend-${CI_COMMIT_REF_SLUG}
  paths:
   - front-end/.npm/
 before_script:
  - cd front-end
  - npm ci --cache .npm --prefer-offline
 script:
  - npm test -- --run

build_backend_image:
 stage: build
 image: docker:27
 services:
  - docker:27-dind
 variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
 before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
 script:
  - docker build -t "$BACKEND_IMAGE" backend
  - docker push "$BACKEND_IMAGE"

build_frontend_image:
 stage: build
 image: docker:27
 services:
  - docker:27-dind
 variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
 before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
 script:
  - docker build --build-arg VITE_API_URL=/api -t "$FRONTEND_IMAGE" front-end
  - docker push "$FRONTEND_IMAGE"

backend_audit:
 stage: security
 image: node:20
 before_script:
  - cd backend
  - npm ci
 script:
  - npm audit --audit-level=high

frontend_audit:
 stage: security
 image: node:20
 before_script:
  - cd front-end
  - npm ci
 script:
  - npm audit --audit-level=high

semgrep:
  stage: security
  image: returntocorp/semgrep
  script:
   - semgrep --config=auto .
  
zap_baseline:
 stage: security
 image: docker:27
 services:
  - docker:27-dind
 variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
 script:
  - docker compose up -d --build
  - NETWORK_NAME=$(docker network ls --format '{{.Name}}' | grep '_default' | head -n 1)
  - docker run --rm -v "$PWD:/zap/wrk" --network "$NETWORK_NAME" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://frontend:80 -r zap-report.html -I
 after_script:
  - docker compose down || true
 artifacts:
  when: always
  paths:
   - zap-report.html

deploy_kubernetes:
 stage: deploy
 image:
  name: bitnami/kubectl:latest
  entrypoint: [""]
 variables:
  KUBE_NAMESPACE: cinematheque
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
 before_script:
  - test -n "$KUBE_URL"
  - test -n "$KUBE_TOKEN"
  - mkdir -p ~/.kube
  - kubectl config set-cluster gitlab --server="$KUBE_URL" --insecure-skip-tls-verify=true
  - kubectl config set-credentials gitlab --token="$KUBE_TOKEN"
  - kubectl config set-context gitlab --cluster=gitlab --user=gitlab --namespace="$KUBE_NAMESPACE"
  - kubectl config use-context gitlab
 script:
  - kubectl apply -f k8s/namespace.yaml
  - kubectl apply -f k8s/configmap.yaml
  - kubectl apply -f k8s/minio-pvc.yaml
  - kubectl create secret generic app-secrets --namespace "$KUBE_NAMESPACE" --from-literal=DATABASE_URL="$DATABASE_URL" --from-literal=SECRET_KEY="$SECRET_KEY" --dry-run=client -o yaml | kubectl apply -f -
  - kubectl create secret generic minio-secrets --namespace "$KUBE_NAMESPACE" --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" --from-literal=MINIO_ACCESS_KEY="$MINIO_ROOT_USER" --from-literal=MINIO_SECRET_KEY="$MINIO_ROOT_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
  - kubectl apply -f k8s/minio.yaml
  - kubectl apply -f k8s/backend.yaml
  - kubectl apply -f k8s/frontend.yaml
  - kubectl apply -f k8s/ingress.yaml
  - kubectl apply -f k8s/hpa.yaml
  - kubectl set image deployment/backend backend="$BACKEND_IMAGE" --namespace "$KUBE_NAMESPACE"
  - kubectl set image deployment/frontend frontend="$FRONTEND_IMAGE" --namespace "$KUBE_NAMESPACE"
  - kubectl rollout status deployment/minio --namespace "$KUBE_NAMESPACE" --timeout=180s
  - kubectl rollout status deployment/backend --namespace "$KUBE_NAMESPACE" --timeout=180s
  - kubectl rollout status deployment/frontend --namespace "$KUBE_NAMESPACE" --timeout=180s
 environment:
  name: production
 only:
  - main  
