stages:
 - test
 - security

backend_tests:
 stage: test
 image: node:20
 cache:
  key: backend-${CI_COMMIT_REF_SLUG}
  paths:
   - backend/.npm/
 before_script:
  - cd backend
  - npm ci --cache .npm --prefer-offline
 script:
  - npm test
  
frontend_tests:
 stage: test
 image: node:20
 cache:
  key: frontend-${CI_COMMIT_REF_SLUG}
  paths:
   - front-end/.npm/
 before_script:
  - cd front-end
  - npm ci --cache .npm --prefer-offline
 script:
  - npm test -- --run

backend_audit:
 stage: security
 image: node:20
 before_script:
  - cd backend
  - npm ci
 script:
  - npm audit --audit-level=high

frontend_audit:
 stage: security
 image: node:20
 before_script:
  - cd front-end
  - npm ci
 script:
  - npm audit --audit-level=high

semgrep:
  stage: security
  image: returntocorp/semgrep
  script:
   - semgrep --config=auto .
  
zap_baseline:
 stage: security
 image: docker:27
 services:
  - docker:27-dind
 variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
 script:
  - docker compose up -d --build
  - NETWORK_NAME=$(docker network ls --format '{{.Name}}' | grep '_default' | head -n 1)
  - docker run --rm -v "$PWD:/zap/wrk" --network "$NETWORK_NAME" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://frontend:80 -r zap-report.html -I
 after_script:
  - docker compose down || true
 artifacts:
  when: always
  paths:
   - zap-report.html